# Include from the existing chart-nginx default.conf at http scope.
# The same file is replaced by deploy.sh after certificate issuance.
server {
    listen 80;
    server_name api.dongne.town;
    location ^~ /.well-known/acme-challenge/ {
        root /etc/nginx/ssl/dongne/www;
    }
    location / { return 503; }
}
