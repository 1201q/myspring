# Used after certificate issuance, before the first Spring deployment.
server {
    listen 80;
    server_name api.dongne.town;
    location ^~ /.well-known/acme-challenge/ { root /etc/nginx/ssl/dongne/www; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name api.dongne.town;
    ssl_certificate /etc/nginx/ssl/dongne/letsencrypt/live/api.dongne.town/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/dongne/letsencrypt/live/api.dongne.town/privkey.pem;
    location / { return 503; }
}
