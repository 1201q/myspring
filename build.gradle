plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'Permit map learning project'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.locationtech.proj4j:proj4j:1.4.3'
	implementation 'org.apache.commons:commons-csv:1.14.1'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'com.h2database:h2'
	runtimeOnly 'org.postgresql:postgresql'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.register('auditRestaurantSample', JavaExec) {
	group = 'verification'
	description = 'Validate the local Seoul restaurant sample without starting Spring or a database.'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.example.permitmap.ingestion.RestaurantSampleAudit'
	args layout.projectDirectory.file('docs/data-samples/guro-restaurants.sample.json').asFile.absolutePath
}

tasks.register('importRestaurantSample', JavaExec) {
	group = 'application'
	description = 'Import the Guro-gu sample into the configured database without opening an HTTP port.'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.example.permitmap.ingestion.RestaurantSampleImport'
	args layout.projectDirectory.file('docs/data-samples/guro-restaurants.sample.json').asFile.absolutePath
}

tasks.register('importNationalPermits', JavaExec) {
	group = 'application'
	description = 'Import one nationwide CSV; local H2 by default, PostgreSQL requires explicit target/database.'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.example.permitmap.ingestion.national.NationalPermitImport'
	['category', 'input', 'snapshot', 'resume', 'target', 'database'].each { key ->
		if (project.hasProperty(key)) args "--${key}=${project.property(key)}"
	}
}

tasks.register('testNationalPostgres', Test) {
	group = 'verification'
	description = 'Run national importer integration tests only against an explicitly named disposable PostgreSQL database.'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform()
	filter { includeTestsMatching '*NationalPermitBatchImporterTests' }
	outputs.upToDateWhen { false }
	doFirst {
		def database = project.findProperty('database')?.toString() ?: ''
		if (!(database ==~ /permit_map_verify_[a-z0-9_]+/)) {
			throw new GradleException('Tests require an explicit permit_map_verify_... database; live databases are refused.')
		}
		def secrets = new Properties()
		file('.env.postgres').withReader('UTF-8') { secrets.load(it) }
		if (!secrets.getProperty('DB_PASSWORD')) throw new GradleException('Missing DB_PASSWORD')
		environment 'DB_PASSWORD', secrets.getProperty('DB_PASSWORD')
		systemProperty 'spring.profiles.active', 'postgres'
		systemProperty 'spring.datasource.url', "jdbc:postgresql://127.0.0.1:15432/${database}"
		systemProperty 'spring.datasource.username', secrets.getProperty('DB_USERNAME', 'permit_map_app')
		systemProperty 'spring.datasource.driver-class-name', 'org.postgresql.Driver'
		systemProperty 'spring.datasource.hikari.maximum-pool-size', '3'
		systemProperty 'spring.datasource.hikari.data-source-properties.reWriteBatchedInserts', 'true'
		if (project.hasProperty('performanceRows')) {
			def rows = project.property('performanceRows').toString().toInteger()
			if (rows < 1 || rows > 100000) throw new GradleException('Performance verification rows must be 1..100000')
			systemProperty 'national.import.performance', 'true'
			systemProperty 'national.import.performance.rows', rows.toString()
		}
	}
}
