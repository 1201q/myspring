plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'Permit map learning project'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'com.h2database:h2'
	runtimeOnly 'org.postgresql:postgresql'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.register('auditRestaurantSample', JavaExec) {
	group = 'verification'
	description = 'Validate the local Seoul restaurant sample without starting Spring or a database.'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.example.permitmap.ingestion.RestaurantSampleAudit'
	args layout.projectDirectory.file('docs/data-samples/guro-restaurants.sample.json').asFile.absolutePath
}

tasks.register('importRestaurantSample', JavaExec) {
	group = 'application'
	description = 'Import the Guro-gu sample into the configured database without opening an HTTP port.'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.example.permitmap.ingestion.RestaurantSampleImport'
	args layout.projectDirectory.file('docs/data-samples/guro-restaurants.sample.json').asFile.absolutePath
}
